  function safeFloat(x){
    if(x === null || x === undefined) return null;
    const v = Number(String(x).replace(",", "."));
    return Number.isFinite(v) ? v : null;
  }

  function fmtMoney(v, digits=2){
    if(!Number.isFinite(v)) return "—";
    return v.toFixed(digits);
  }

  function fmtUpdated(ts){
    const n = Number(ts);
    if(!Number.isFinite(n) || n <= 0) return null;
    const d = new Date(n * 1000);
    const pad = (k)=> String(k).padStart(2,"0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderFx(amountTjs){
    const fxBox = document.getElementById("fx");
    fxBox.innerHTML = "";

    const rubPerTjs = safeFloat(p.get("rub_per_tjs"));
    const tjsPerUsd = safeFloat(p.get("tjs_per_usd"));
    const updatedAt = p.get("updated_at");

    const rub = (Number.isFinite(amountTjs) && Number.isFinite(rubPerTjs)) ? (amountTjs * rubPerTjs) : null;
    const usd = (Number.isFinite(amountTjs) && Number.isFinite(tjsPerUsd) && tjsPerUsd !== 0) ? (amountTjs / tjsPerUsd) : null;

    const t = T[lang] || T.ru;

    const rows = [];
    if(Number.isFinite(rub)) rows.push({k:`${t.approx} RUB`, v:`${fmtMoney(rub,2)} ₽`});
    if(Number.isFinite(usd)) rows.push({k:`${t.approx} USD`, v:`$${fmtMoney(usd,2)}`});

    const u = fmtUpdated(updatedAt);
    if(u) rows.push({k:`${t.fxUpdated}`, v:`${u}`});

    if(rows.length === 0) return;

    for(const r of rows){
      const el = document.createElement("div");
      el.className = "fxline";
      el.innerHTML = `<span>${r.k}</span><b>${r.v}</b>`;
      fxBox.appendChild(el);
    }
  }

      document.getElementById("bank-icon").innerText = bank.toUpperCase();

      // bank
const bank = (p.get("bank") || "").toLowerCase();

if (bank && BANKS[bank]) {
  const b = BANKS[bank];

  document.getElementById("bank-name").innerText =
    `${b.icon} ${b.name}`;

  document.getElementById("bank-icon").innerText =
    bank.toUpperCase();

  // 🔥 приоритет: query → BANKS → "—"
  const qAcc = (p.get("pay_account") || "").trim();
  const qPh  = (p.get("pay_phone") || "").trim();

  const acc =
    qAcc !== "" ? qAcc :
    (b.account && b.account.trim() !== "" ? b.account : "—");

  const ph =
    qPh !== "" ? qPh :
    (b.phone && b.phone.trim() !== "" ? b.phone : "—");

  document.getElementById("bank-details").innerText =
    `${t.account}: ${acc}\n${t.phone}: ${ph}`;

} else {
  document.getElementById("bank-name").innerText = "—";
  document.getElementById("bank-details").innerText = "—";
  document.getElementById("bank-icon").innerText = "—";
}

    // amount
    const amountRaw = p.get("amount");
    const amount = safeFloat(amountRaw);
    const cur = (p.get("currency") || "").toUpperCase();

    if(Number.isFinite(amount)){
      document.getElementById("amount").innerHTML = `${fmtMoney(amount,2)} <small>${cur || ""}</small>`;
    }else{
      document.getElementById("amount").innerText = "—";
    }

    renderFx(amount);

    // buttons
    document.getElementById("back").innerText = t.back;
    document.getElementById("howto").innerText = t.howto;
    document.getElementById("payvideo").innerText = t.payvideo;

    document.getElementById("back").onclick = () => window.open(BOT_URL, "_blank");
    document.getElementById("howto").onclick = () => window.open(HOWTO_URL, "_blank");
    document.getElementById("payvideo").onclick = () => window.open(VIDEO_URL, "_blank");

    // langs
    document.querySelectorAll("#langs button").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.lang === lang);
      btn.onclick = ()=>{
        p.set("lang", btn.dataset.lang);
        location.search = p.toString();
      };
    });
  }

  render();
</script>
</body>
</html>
